{% extends "base.html" %}
{% block title %}Register Citizen Account — CIVICLENS AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-dark text-white text-center py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-person-plus me-2"></i>Citizen Registration</h5>
        <small class="text-white-50">Create an account to submit and track civic grievances</small>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a username">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" minlength="8" required placeholder="Minimum 8 characters">
          </div>

          <div class="mb-3">
            <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-check-circle me-1"></i> Register Account
          </button>
        </form>

        <div class="mt-3 text-center small text-muted">
          Already registered? <a href="{{ url_for('auth.login') }}">Log in here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
